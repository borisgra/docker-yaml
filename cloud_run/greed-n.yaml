##create gcloud run services replace greed-n.yaml  --project com-gra  --region us-central1
##export gcloud run services describe dsv --format export > greed-n.yaml
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: greed-n
  labels:
    cloud.googleapis.com/location: us-central1
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/ingress-status: all
    run.googleapis.com/invoker-iam-disabled: 'true'
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: '5'
        run.googleapis.com/startup-cpu-boost: 'true'
    spec:
      containerConcurrency: 1
      timeoutSeconds: 20
#      serviceAccountName: myserviceaccount@vpn-gra.iam.gserviceaccount.com
      containers:
        - name: greed-n
          image: 'borisgra/greed:nginx-91'
          ports:
            - name: http1
              containerPort: 3000
          env:
            - name: PASS
              value: '12345'
          resources:
            limits:
              cpu: 80m
              memory: 128Mi
          startupProbe:
            timeoutSeconds: 240
            periodSeconds: 240
            failureThreshold: 1
            tcpSocket:
              port: 3000
  traffic:
    - percent: 100
      latestRevision: true
